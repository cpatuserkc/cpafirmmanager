<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: Arial, sans-serif; }
    .title { font-size: 20px; font-weight: bold; }
    .subtitle { font-size: 14px; }
    .layer { font-size: 16px; font-weight: bold; }
    .component { font-size: 12px; }
    .arrow { stroke: #666; stroke-width: 2; marker-end: url(#arrowhead); }
    .box { fill: #f0f0f0; stroke: #666; stroke-width: 2; rx: 5; ry: 5; }
    .client-box { fill: #e1f5fe; stroke: #0288d1; }
    .server-box { fill: #e8f5e9; stroke: #2e7d32; }
    .db-box { fill: #fff3e0; stroke: #ef6c00; }
  </style>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="40" class="title" text-anchor="middle">CPA Firm Manager Architecture</text>
  <text x="400" y="60" class="subtitle" text-anchor="middle">TypeScript + React + Express + PostgreSQL</text>
  
  <!-- Client Layer -->
  <rect x="50" y="100" width="700" height="120" class="box client-box" opacity="0.3" />
  <text x="60" y="120" class="layer">Client Layer (React)</text>
  
  <rect x="100" y="140" width="120" height="60" class="box client-box" />
  <text x="160" y="170" text-anchor="middle" class="component">Pages</text>
  <text x="160" y="185" text-anchor="middle" class="component" font-size="10">proposals.tsx, clients.tsx</text>
  
  <rect x="250" y="140" width="120" height="60" class="box client-box" />
  <text x="310" y="170" text-anchor="middle" class="component">Components</text>
  <text x="310" y="185" text-anchor="middle" class="component" font-size="10">forms, ui elements</text>
  
  <rect x="400" y="140" width="120" height="60" class="box client-box" />
  <text x="460" y="170" text-anchor="middle" class="component">Hooks</text>
  <text x="460" y="185" text-anchor="middle" class="component" font-size="10">useQuery, useAuth</text>
  
  <rect x="550" y="140" width="120" height="60" class="box client-box" />
  <text x="610" y="170" text-anchor="middle" class="component">Context</text>
  <text x="610" y="185" text-anchor="middle" class="component" font-size="10">Auth, Firms, Settings</text>
  
  <!-- Server Layer -->
  <rect x="50" y="250" width="700" height="120" class="box server-box" opacity="0.3" />
  <text x="60" y="270" class="layer">Server Layer (Express)</text>
  
  <rect x="100" y="290" width="120" height="60" class="box server-box" />
  <text x="160" y="320" text-anchor="middle" class="component">API Routes</text>
  <text x="160" y="335" text-anchor="middle" class="component" font-size="10">auth, firms, proposals</text>
  
  <rect x="250" y="290" width="120" height="60" class="box server-box" />
  <text x="310" y="320" text-anchor="middle" class="component">Storage</text>
  <text x="310" y="335" text-anchor="middle" class="component" font-size="10">Database Storage</text>
  
  <rect x="400" y="290" width="120" height="60" class="box server-box" />
  <text x="460" y="320" text-anchor="middle" class="component">ML Services</text>
  <text x="460" y="335" text-anchor="middle" class="component" font-size="10">Insights, Adapter</text>
  
  <rect x="550" y="290" width="120" height="60" class="box server-box" />
  <text x="610" y="320" text-anchor="middle" class="component">Middleware</text>
  <text x="610" y="335" text-anchor="middle" class="component" font-size="10">Auth, Validation</text>
  
  <!-- Database Layer -->
  <rect x="50" y="400" width="700" height="120" class="box db-box" opacity="0.3" />
  <text x="60" y="420" class="layer">Database Layer (PostgreSQL)</text>
  
  <rect x="100" y="440" width="120" height="60" class="box db-box" />
  <text x="160" y="470" text-anchor="middle" class="component">Users/Firms</text>
  <text x="160" y="485" text-anchor="middle" class="component" font-size="10">Authentication, Profiles</text>
  
  <rect x="250" y="440" width="120" height="60" class="box db-box" />
  <text x="310" y="470" text-anchor="middle" class="component">Clients/Contacts</text>
  <text x="310" y="485" text-anchor="middle" class="component" font-size="10">Client Management</text>
  
  <rect x="400" y="440" width="120" height="60" class="box db-box" />
  <text x="460" y="470" text-anchor="middle" class="component">Proposals/Services</text>
  <text x="460" y="485" text-anchor="middle" class="component" font-size="10">Business Development</text>
  
  <rect x="550" y="440" width="120" height="60" class="box db-box" />
  <text x="610" y="470" text-anchor="middle" class="component">Time/Resources</text>
  <text x="610" y="485" text-anchor="middle" class="component" font-size="10">Time Management</text>
  
  <!-- Arrows -->
  <!-- Client to Server -->
  <line x1="160" y1="200" x2="160" y2="290" class="arrow" />
  <line x1="310" y1="200" x2="310" y2="290" class="arrow" />
  <line x1="460" y1="200" x2="460" y2="290" class="arrow" />
  <line x1="610" y1="200" x2="610" y2="290" class="arrow" />
  
  <!-- Server to Database -->
  <line x1="160" y1="350" x2="160" y2="440" class="arrow" />
  <line x1="310" y1="350" x2="310" y2="440" class="arrow" />
  <line x1="460" y1="350" x2="460" y2="440" class="arrow" />
  <line x1="610" y1="350" x2="610" y2="440" class="arrow" />
  
  <text x="400" y="550" text-anchor="middle" class="component">© CPA Firm Manager Platform</text>
</svg>