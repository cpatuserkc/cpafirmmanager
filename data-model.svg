<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="1000" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: Arial, sans-serif; }
    .title { font-size: 20px; font-weight: bold; }
    .subtitle { font-size: 14px; }
    .entity-title { font-size: 14px; font-weight: bold; }
    .entity-field { font-size: 12px; }
    .pk { font-weight: bold; }
    .fk { font-style: italic; }
    .relation { stroke: #666; stroke-width: 1.5; marker-end: url(#arrowhead); }
    .entity { fill: #f8f9fa; stroke: #495057; stroke-width: 1.5; rx: 5; ry: 5; }
    .entity-header { fill: #e9ecef; stroke: #495057; stroke-width: 1; }
    .user-entity { fill: #e3f2fd; stroke: #1565c0; }
    .user-header { fill: #bbdefb; stroke: #1565c0; }
    .firm-entity { fill: #e8f5e9; stroke: #2e7d32; }
    .firm-header { fill: #c8e6c9; stroke: #2e7d32; }
    .client-entity { fill: #f3e5f5; stroke: #6a1b9a; }
    .client-header { fill: #e1bee7; stroke: #6a1b9a; }
    .proposal-entity { fill: #fff8e1; stroke: #ff8f00; }
    .proposal-header { fill: #ffecb3; stroke: #ff8f00; }
    .service-entity { fill: #ffebee; stroke: #c62828; }
    .service-header { fill: #ffcdd2; stroke: #c62828; }
  </style>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="40" class="title" text-anchor="middle">CPA Firm Manager Data Model</text>
  <text x="400" y="60" class="subtitle" text-anchor="middle">Key Entities and Relationships</text>
  
  <!-- User Entity -->
  <rect x="50" y="100" width="200" height="30" class="entity-header user-header" />
  <rect x="50" y="130" width="200" height="120" class="entity user-entity" />
  <text x="150" y="120" class="entity-title" text-anchor="middle">User</text>
  <text x="60" y="150" class="entity-field pk">id: serial (PK)</text>
  <text x="60" y="170" class="entity-field">username: text</text>
  <text x="60" y="190" class="entity-field">email: text</text>
  <text x="60" y="210" class="entity-field">passwordHash: text</text>
  <text x="60" y="230" class="entity-field">createdAt: timestamp</text>
  
  <!-- Firm Entity -->
  <rect x="500" y="100" width="220" height="30" class="entity-header firm-header" />
  <rect x="500" y="130" width="220" height="140" class="entity firm-entity" />
  <text x="610" y="120" class="entity-title" text-anchor="middle">Firm</text>
  <text x="510" y="150" class="entity-field pk">id: serial (PK)</text>
  <text x="510" y="170" class="entity-field">name: text</text>
  <text x="510" y="190" class="entity-field">address: text</text>
  <text x="510" y="210" class="entity-field">phone: text</text>
  <text x="510" y="230" class="entity-field">taxId: text</text>
  <text x="510" y="250" class="entity-field fk">createdById: integer (FK)</text>
  
  <!-- UserFirmRelationship Entity -->
  <rect x="280" y="100" width="190" height="30" class="entity-header" />
  <rect x="280" y="130" width="190" height="100" class="entity" />
  <text x="375" y="120" class="entity-title" text-anchor="middle">UserFirmRelationship</text>
  <text x="290" y="150" class="entity-field pk">id: serial (PK)</text>
  <text x="290" y="170" class="entity-field fk">userId: integer (FK)</text>
  <text x="290" y="190" class="entity-field fk">firmId: integer (FK)</text>
  <text x="290" y="210" class="entity-field">role: text</text>
  
  <!-- Contact Entity -->
  <rect x="280" y="300" width="190" height="30" class="entity-header client-header" />
  <rect x="280" y="330" width="190" height="160" class="entity client-entity" />
  <text x="375" y="320" class="entity-title" text-anchor="middle">Contact</text>
  <text x="290" y="350" class="entity-field pk">id: serial (PK)</text>
  <text x="290" y="370" class="entity-field">firstName: text</text>
  <text x="290" y="390" class="entity-field">lastName: text</text>
  <text x="290" y="410" class="entity-field">email: text</text>
  <text x="290" y="430" class="entity-field">phone: text</text>
  <text x="290" y="450" class="entity-field fk">firmId: integer (FK)</text>
  <text x="290" y="470" class="entity-field fk">createdById: integer (FK)</text>
  
  <!-- ClientCompany Entity -->
  <rect x="500" y="300" width="220" height="30" class="entity-header client-header" />
  <rect x="500" y="330" width="220" height="180" class="entity client-entity" />
  <text x="610" y="320" class="entity-title" text-anchor="middle">ClientCompany</text>
  <text x="510" y="350" class="entity-field pk">id: serial (PK)</text>
  <text x="510" y="370" class="entity-field">name: text</text>
  <text x="510" y="390" class="entity-field">industry: text</text>
  <text x="510" y="410" class="entity-field">address: text</text>
  <text x="510" y="430" class="entity-field">ein: text</text>
  <text x="510" y="450" class="entity-field fk">firmId: integer (FK)</text>
  <text x="510" y="470" class="entity-field fk">contactId: integer (FK)</text>
  <text x="510" y="490" class="entity-field fk">createdById: integer (FK)</text>
  
  <!-- ProfessionalRole Entity -->
  <rect x="50" y="300" width="200" height="30" class="entity-header service-header" />
  <rect x="50" y="330" width="200" height="140" class="entity service-entity" />
  <text x="150" y="320" class="entity-title" text-anchor="middle">ProfessionalRole</text>
  <text x="60" y="350" class="entity-field pk">id: serial (PK)</text>
  <text x="60" y="370" class="entity-field">name: text</text>
  <text x="60" y="390" class="entity-field">topTierRate: numeric</text>
  <text x="60" y="410" class="entity-field">midTierRatePercent: numeric</text>
  <text x="60" y="430" class="entity-field">lowTierRatePercent: numeric</text>
  <text x="60" y="450" class="entity-field fk">firmId: integer (FK)</text>
  
  <!-- Service Entity -->
  <rect x="50" y="500" width="200" height="30" class="entity-header service-header" />
  <rect x="50" y="530" width="200" height="140" class="entity service-entity" />
  <text x="150" y="520" class="entity-title" text-anchor="middle">Service</text>
  <text x="60" y="550" class="entity-field pk">id: serial (PK)</text>
  <text x="60" y="570" class="entity-field">name: text</text>
  <text x="60" y="590" class="entity-field">category: text</text>
  <text x="60" y="610" class="entity-field">defaultRate: numeric</text>
  <text x="60" y="630" class="entity-field fk">firmId: integer (FK)</text>
  <text x="60" y="650" class="entity-field fk">createdById: integer (FK)</text>
  
  <!-- Project Entity -->
  <rect x="280" y="500" width="190" height="30" class="entity-header" />
  <rect x="280" y="530" width="190" height="160" class="entity" />
  <text x="375" y="520" class="entity-title" text-anchor="middle">Project</text>
  <text x="290" y="550" class="entity-field pk">id: serial (PK)</text>
  <text x="290" y="570" class="entity-field">name: text</text>
  <text x="290" y="590" class="entity-field">status: text</text>
  <text x="290" y="610" class="entity-field">startDate: timestamp</text>
  <text x="290" y="630" class="entity-field">endDate: timestamp</text>
  <text x="290" y="650" class="entity-field fk">clientCompanyId: integer (FK)</text>
  <text x="290" y="670" class="entity-field fk">firmId: integer (FK)</text>
  
  <!-- Proposal Entity -->
  <rect x="500" y="500" width="220" height="30" class="entity-header proposal-header" />
  <rect x="500" y="530" width="220" height="200" class="entity proposal-entity" />
  <text x="610" y="520" class="entity-title" text-anchor="middle">Proposal</text>
  <text x="510" y="550" class="entity-field pk">id: serial (PK)</text>
  <text x="510" y="570" class="entity-field">title: text</text>
  <text x="510" y="590" class="entity-field">content: text</text>
  <text x="510" y="610" class="entity-field">status: text</text>
  <text x="510" y="630" class="entity-field">estimatedHours: numeric</text>
  <text x="510" y="650" class="entity-field">estimatedCost: numeric</text>
  <text x="510" y="670" class="entity-field">expiryDate: timestamp</text>
  <text x="510" y="690" class="entity-field fk">firmId: integer (FK)</text>
  <text x="510" y="710" class="entity-field fk">clientCompanyId: integer (FK)</text>
  
  <!-- ProposalService Entity -->
  <rect x="280" y="700" width="190" height="30" class="entity-header proposal-header" />
  <rect x="280" y="730" width="190" height="140" class="entity proposal-entity" />
  <text x="375" y="720" class="entity-title" text-anchor="middle">ProposalService</text>
  <text x="290" y="750" class="entity-field pk">id: serial (PK)</text>
  <text x="290" y="770" class="entity-field fk">proposalId: integer (FK)</text>
  <text x="290" y="790" class="entity-field fk">serviceId: integer (FK)</text>
  <text x="290" y="810" class="entity-field">quantity: numeric</text>
  <text x="290" y="830" class="entity-field">rate: numeric</text>
  <text x="290" y="850" class="entity-field fk">professionalRoleId: integer (FK)</text>
  
  <!-- Relations -->
  <!-- User-Firm relations -->
  <path d="M 250 150 L 280 150" class="relation" />
  <path d="M 470 150 L 500 150" class="relation" />
  <path d="M 150 250 L 150 470 L 290 470" class="relation" />
  <path d="M 150 250 L 150 650 L 290 650" class="relation" />
  
  <!-- Firm relations -->
  <path d="M 610 270 L 610 450" class="relation" />
  <path d="M 610 270 L 610 350 L 470 350" class="relation" />
  <path d="M 610 270 L 610 690" class="relation" />
  <path d="M 500 250 L 400 250 L 400 300" class="relation" />
  
  <!-- ClientCompany relations -->
  <path d="M 470 430 L 400 430" class="relation" />
  <path d="M 500 650 L 470 650" class="relation" />
  
  <!-- Service-Proposal relations -->
  <path d="M 150 670 L 150 800 L 280 800" class="relation" />
  <path d="M 500 770 L 470 770" class="relation" />
  <path d="M 150 470 L 80 470 L 80 830 L 290 830" class="relation" />
  
  <text x="400" y="950" text-anchor="middle" class="entity-field">© CPA Firm Manager Platform</text>
</svg>