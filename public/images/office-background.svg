<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Wall background -->
  <rect width="1200" height="800" fill="#f5f5f5"/>
  
  <!-- Floor -->
  <rect y="650" width="1200" height="150" fill="#e0e0e0"/>
  <pattern id="floorPattern" patternUnits="userSpaceOnUse" width="100" height="100" patternTransform="rotate(45)">
    <rect width="100" height="100" fill="#e0e0e0"/>
    <line x1="0" y1="0" x2="100" y2="0" stroke="#d0d0d0" stroke-width="2"/>
    <line x1="0" y1="50" x2="100" y2="50" stroke="#d0d0d0" stroke-width="1"/>
  </pattern>
  <rect y="650" width="1200" height="150" fill="url(#floorPattern)" opacity="0.5"/>
  
  <!-- Wall panel effect -->
  <line x1="0" y1="200" x2="1200" y2="200" stroke="#e0e0e0" stroke-width="3"/>
  <line x1="0" y1="400" x2="1200" y2="400" stroke="#e0e0e0" stroke-width="3"/>
  <line x1="0" y1="600" x2="1200" y2="600" stroke="#e0e0e0" stroke-width="3"/>
  
  <!-- Windows on the wall -->
  <rect x="150" y="100" width="200" height="300" fill="#e8f4fa"/>
  <rect x="150" y="100" width="200" height="300" fill="none" stroke="#d0d0d0" stroke-width="8"/>
  <line x1="250" y1="100" x2="250" y2="400" stroke="#d0d0d0" stroke-width="5"/>
  <line x1="150" y1="250" x2="350" y2="250" stroke="#d0d0d0" stroke-width="5"/>
  
  <rect x="850" y="100" width="200" height="300" fill="#e8f4fa"/>
  <rect x="850" y="100" width="200" height="300" fill="none" stroke="#d0d0d0" stroke-width="8"/>
  <line x1="950" y1="100" x2="950" y2="400" stroke="#d0d0d0" stroke-width="5"/>
  <line x1="850" y1="250" x2="1050" y2="250" stroke="#d0d0d0" stroke-width="5"/>
  
  <!-- Office plants in corners -->
  <g transform="translate(50, 600)">
    <rect x="0" y="-70" width="40" height="70" fill="#8b5a2b"/>
    <ellipse cx="20" cy="-100" rx="50" ry="60" fill="#2e7d32"/>
    <ellipse cx="40" cy="-110" rx="40" ry="50" fill="#388e3c"/>
  </g>
  
  <g transform="translate(1150, 600)">
    <rect x="-40" y="-70" width="40" height="70" fill="#8b5a2b"/>
    <ellipse cx="-20" cy="-100" rx="50" ry="60" fill="#2e7d32"/>
    <ellipse cx="-40" cy="-110" rx="40" ry="50" fill="#388e3c"/>
  </g>
  
  <!-- Office lights on ceiling -->
  <rect x="300" y="50" width="150" height="6" fill="#e0e0e0" rx="3"/>
  <rect x="750" y="50" width="150" height="6" fill="#e0e0e0" rx="3"/>
  <rect x="300" y="56" width="150" height="2" fill="#f5f5f5"/>
  <rect x="750" y="56" width="150" height="2" fill="#f5f5f5"/>
  
  <!-- Clock on wall -->
  <circle cx="600" cy="150" r="40" fill="white" stroke="#d0d0d0" stroke-width="4"/>
  <circle cx="600" cy="150" r="3" fill="#333"/>
  <line x1="600" y1="150" x2="600" y2="120" stroke="#333" stroke-width="3"/>
  <line x1="600" y1="150" x2="625" y2="150" stroke="#333" stroke-width="3"/>
</svg>