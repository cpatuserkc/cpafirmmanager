<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="500" viewBox="0 0 300 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Filing Cabinet Body -->
  <rect x="50" y="50" width="200" height="400" rx="5" fill="#78909c" stroke="#546e7a" stroke-width="3"/>
  
  <!-- Cabinet Shadow -->
  <rect x="55" y="55" width="190" height="390" rx="3" fill="#546e7a" opacity="0.3"/>
  
  <!-- Top Drawer -->
  <rect x="60" y="70" width="180" height="100" rx="2" fill="#90a4ae" stroke="#546e7a" stroke-width="2"/>
  <rect x="125" y="110" width="50" height="20" rx="5" fill="#eceff1" stroke="#546e7a" stroke-width="1"/>
  <rect x="135" y="115" width="30" height="10" rx="2" fill="#b0bec5"/>
  
  <!-- Middle Drawer -->
  <rect x="60" y="190" width="180" height="100" rx="2" fill="#90a4ae" stroke="#546e7a" stroke-width="2"/>
  <rect x="125" y="230" width="50" height="20" rx="5" fill="#eceff1" stroke="#546e7a" stroke-width="1"/>
  <rect x="135" y="235" width="30" height="10" rx="2" fill="#b0bec5"/>
  
  <!-- Bottom Drawer -->
  <rect x="60" y="310" width="180" height="100" rx="2" fill="#90a4ae" stroke="#546e7a" stroke-width="2"/>
  <rect x="125" y="350" width="50" height="20" rx="5" fill="#eceff1" stroke="#546e7a" stroke-width="1"/>
  <rect x="135" y="355" width="30" height="10" rx="2" fill="#b0bec5"/>
  
  <!-- Highlights and details -->
  <line x1="60" y1="70" x2="240" y2="70" stroke="#cfd8dc" stroke-width="1"/>
  <line x1="60" y1="190" x2="240" y2="190" stroke="#cfd8dc" stroke-width="1"/>
  <line x1="60" y1="310" x2="240" y2="310" stroke="#cfd8dc" stroke-width="1"/>
  
  <!-- Top reflections -->
  <line x1="60" y1="55" x2="240" y2="55" stroke="#eceff1" stroke-width="1" opacity="0.5"/>
  <line x1="70" y1="75" x2="230" y2="75" stroke="#eceff1" stroke-width="1" opacity="0.3"/>
  <line x1="70" y1="195" x2="230" y2="195" stroke="#eceff1" stroke-width="1" opacity="0.3"/>
  <line x1="70" y1="315" x2="230" y2="315" stroke="#eceff1" stroke-width="1" opacity="0.3"/>
  
  <!-- Cabinet Top -->
  <rect x="50" y="40" width="200" height="10" rx="2" fill="#455a64" stroke="#37474f" stroke-width="2"/>
  
  <!-- Cabinet Bottom -->
  <rect x="45" y="450" width="210" height="15" rx="2" fill="#455a64" stroke="#37474f" stroke-width="2"/>
  
  <!-- Label Holders -->
  <rect x="70" y="85" width="160" height="15" rx="1" fill="#eceff1" stroke="#b0bec5" stroke-width="1" opacity="0.8"/>
  <rect x="70" y="205" width="160" height="15" rx="1" fill="#eceff1" stroke="#b0bec5" stroke-width="1" opacity="0.8"/>
  <rect x="70" y="325" width="160" height="15" rx="1" fill="#eceff1" stroke="#b0bec5" stroke-width="1" opacity="0.8"/>
</svg>